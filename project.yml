name: GitStreak
options:
  bundleIdPrefix: com.kyreshamwell.gitstreak
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  GitStreak:
    type: application
    platform: iOS
    sources:
      - path: GitStreak
      - path: Shared
    info:
      path: GitStreak/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: GitStreak
    entitlements:
      path: GitStreak/GitStreak.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.gitstreak
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.gitstreak.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.gitstreak
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: GitStreakWidgetExtension
        embed: true

  GitStreakWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: GitStreakWidget
      - path: Shared
    info:
      path: GitStreakWidget/Info.plist
      properties:
        CFBundleDisplayName: GitStreak Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GitStreakWidget/GitStreakWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.gitstreak
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.gitstreak.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.gitstreak.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
