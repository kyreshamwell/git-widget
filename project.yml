name: Pushed
options:
  bundleIdPrefix: com.kyreshamwell.pushed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set here rather than in Xcode — `xcodegen generate` rewrites the pbxproj
    # from this file, so a team picked in the UI is wiped on the next run.
    DEVELOPMENT_TEAM: KJ39PZWS6C
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"

packages: {}

targets:
  Pushed:
    type: application
    platform: iOS
    sources:
      - path: Pushed
      - path: Shared
    info:
      path: Pushed/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Pushed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kyreshamwell.pushed.refresh
        # These two live here, not in INFOPLIST_KEY_* build settings — those are
        # only consulted when GENERATE_INFOPLIST_FILE is on, and this target ships
        # an explicit plist. As build settings they compiled fine and did nothing,
        # which left the app free to rotate into a landscape the grid never sized for.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Pushed/Pushed.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.pushed
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.pushed.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PushedWidgetExtension
        embed: true

  PushedWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PushedWidget
      - path: Shared
    info:
      path: PushedWidget/Info.plist
      properties:
        CFBundleDisplayName: Pushed Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PushedWidget/PushedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.pushed
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.pushed.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # Logic tests: compiles Shared/ directly into the test bundle, so no host
  # app or signing is needed — plain `xcodebuild test` on any simulator.
  PushedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Pushed:
    build:
      targets:
        Pushed: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PushedTests
