name: Pushed
options:
  bundleIdPrefix: com.kyreshamwell.pushed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"

packages: {}

targets:
  Pushed:
    type: application
    platform: iOS
    sources:
      - path: Pushed
      - path: Shared
    info:
      path: Pushed/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Pushed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kyreshamwell.pushed.refresh
    entitlements:
      path: Pushed/Pushed.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.pushed
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.pushed.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: PushedWidgetExtension
        embed: true

  PushedWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PushedWidget
      - path: Shared
    info:
      path: PushedWidget/Info.plist
      properties:
        CFBundleDisplayName: Pushed Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PushedWidget/PushedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kyreshamwell.pushed
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kyreshamwell.pushed.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

  # Logic tests: compiles Shared/ directly into the test bundle, so no host
  # app or signing is needed — plain `xcodebuild test` on any simulator.
  PushedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyreshamwell.pushed.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Pushed:
    build:
      targets:
        Pushed: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PushedTests
